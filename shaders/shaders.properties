# Put the vanilla per-face brightness (down 0.5 / up 1.0 / N-S 0.8 / W-E 0.6,
# multiplied by AO and biome tint) back into the vertex color / gl_Color.
# Without this Iris and OptiFine default to oldLighting=false, gl_Color only has
# AO + tint, and all block faces get the same brightness.
oldLighting=true

texture.gbuffers.gaux3 = texture/cel_ramp.png

texture.gbuffers.gaux4 = texture/ramp.png


sliders = THRESHOLD RIM_OFFECT OUTLINE_COL OUTLINE_MODE Shininess shadowMapResolution TEXTURE_OUTLINE_STRENGTH  OUTLINE_THICKNESS SHADOW_DISTANCE SHADOW_BRIGHTNESS BLOCK_LIGHT_INTENSITY BLOCK_LIGHT_SHADOW_BOOST

screen = [Shadow] [Outline] [TextureOutline] PAPER_WORLD Shininess CEL 
screen.Shadow = ENABLE_SHADOWS SOFT_SHADOWS shadowMapResolution SHADOW_DISTANCE SHADOW_BRIGHTNESS BLOCK_LIGHT_INTENSITY BLOCK_LIGHT_SHADOW_BOOST
screen.Outline = THRESHOLD RIM_OFFECT OUTLINE_COL LINEAR_DEPTH OUTLINE_MODE
screen.TextureOutline = ENABLE_TEXTURE_OUTLINES TEXTURE_OUTLINE_STRENGTH  OUTLINE_THICKNESS

texture.noise = texture/blueNoiseR.png
